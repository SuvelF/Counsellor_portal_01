<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
	
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
	  <div class="container-fluid">
	    <a class="navbar-brand" href="#">Home</a>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	    <div class="collapse navbar-collapse" id="navbarNav">
	      <ul class="navbar-nav">
	        <li class="nav-item">
	          <a class="nav-link active" aria-current="page" href="#">Home</a>
	        </li>
	        <li class="nav-item">
	          <a class="nav-link" href="enquiry-page">Add Enquiry</a>
	        </li>
	        <li class="nav-item">
	          <a class="nav-link" href="#">View Enquiries</a>
	        </li>
			
			<li class="nav-item">
			  <a class="nav-link" href="logout">Logout</a>
		    </li>
	       
	      </ul>

	<div class="container">
		<h1>Dashboard Info</h1>
		
		<table>
			<tr>
				<td>Total Enquires</td>
				<td th:text="${dashboardDto.totalEnqCnt}"></td>
			</tr>
			<tr>
				<td>Open Enquires</td>
				<td th:text="${dashboardDto.openEnqCnt}"></td>
			</tr>
			<tr>
				<td>Enrolled Enquires</td>
				<td th:text="${dashboardDto.enrolledEnqCnt}"></td>
			</tr>
			<tr>
				<td>Lost Enquires</td>
				<td th:text="${dashboardDto.lostEnqCnt}"></td>
			</tr>
			
		</table>
		
	</div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
