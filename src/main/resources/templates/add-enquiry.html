<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bootstrap demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Home</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="dashboard">Home</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="enquiry-page">Add Enquiry</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="view-enquiries">View Enquiries</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="logout">Logout</a>
					</li>

				</ul>
			</div>
		</div>
	</nav>


	<div class="container">
		<h1>Add Enquiry here</h1>


		<font style="color: red;">
			<p th:text="${emsg}"></p>
		</font>

		<font style="color: green">
			<p th:text="${smsg}"></p>
		</font>
		<form th:action="@{/add-enquiry}" th:object="${enquiry}" method="post">

			<table>
				<tr>
					<td>Student Name</td>
					<td><input type="text" th:field="*{stuName}"></td>
					<input type="hidden" th:field="*{enqId}">
				</tr>

				<tr>
					<td>Student Phone</td>
					<td><input type="text" th:field="*{stuPhno}"></td>
				</tr>

				<tr>
					<td>Class Mode</td>
					<td>
						<select th:field="*{classMode}">
							<option value="">-Select-</option>
							<option value="Classroom">Classroom</option>
							<option value="Online">Online</option>
						</select>

					</td>

				</tr>

				<tr>
					<td>Class Mode</td>
					<td>
						<select th:field="*{course}">
							<option value="">-Select-</option>
							<option value="Java">Java</option>
							<option value="Python">Python</option>
							<option value="DevOps">DevOps</option>
							<option value="AWS">AWS</option>
						</select>
					</td>
				</tr>


				<tr>
					<td>Enquiry Status</td>
					<td>
						<select th:field="*{eneStatus}">
							<option value="">-Select-</option>
							<option value="Open">Open</option>
							<option value="Enrolled">Enrolled</option>
							<option value="Lost">Lost</option>
						</select>
					</td>
				</tr>

				<tr>
					<td></td>
					<td><input type="submit" value="Submit" class="btn btn-primary"></td>
				</tr>

			</table>

		</form>

	</div>


	<h1>Hello, world!</h1>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
